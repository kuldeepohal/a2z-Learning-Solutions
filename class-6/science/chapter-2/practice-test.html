<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 6 Science Chapter 2 Quiz | A2Z Learning Solutions</title><meta name="description" content="Class 6 Science Chapter 2 Diversity in the Living World interactive quiz with scoring and progress analysis."><link rel="stylesheet" href="../chapter.css"><style>.quiz{max-width:900px;margin:auto}.q{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.q label{display:block;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:9px}.result{padding:16px;border-radius:12px;background:#eefaf8;margin:15px 0;font-weight:700}.btn{display:inline-block;padding:11px 16px;border-radius:9px;background:#14213d;color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}@media(max-width:600px){main.wrap{padding:20px!important}}</style></head><body><main class="wrap quiz"><header><a href="../">← Class 6 Science</a><h1>Chapter 2: Diversity in the Living World</h1><p>Learn → Practice → Revise → Test → Analyse</p></header><section class="card"><p><strong>Instructions:</strong> Attempt all questions. Submit to see your score. Your best score and attempts are stored in this browser.</p><div id="quiz"></div><button class="btn" id="submit">Submit Test</button><div id="result" class="result" hidden></div><p><a href="../../notes/class6-ch2.html">← Return to Chapter Notes</a></p></section></main><script>(function(){const key='a2z-c6-sci-ch2-test';const questions=[['Which term means the variety of plants and animals in a region?',['Grouping','Biodiversity','Venation','Adaptation'],1],['Which plant group generally has small, soft and green stems?',['Trees','Shrubs','Herbs','Climbers'],2],['What is the pattern of veins on a leaf called?',['Venation','Cotyledon','Habitat','Biodiversity'],0],['Which root has one main root with smaller side roots?',['Fibrous root','Taproot','Aerial root','No root'],1],['How many cotyledons does a monocot seed have?',['One','Two','Three','None'],0],['Which venation is generally associated with monocots?',['Reticulate','Parallel','Circular','None'],1],['Which body part helps a fish move in water according to the chapter?',['Legs','Wings','Fins','Hooves'],2],['What is a habitat?',['A type of seed','The place where an organism lives','A leaf pattern','A movement type'],1],['What are special features that help organisms survive in a particular region called?',['Adaptations','Cotyledons','Grouping','Venation'],0],['Which animals can live on land as well as in water?',['Amphibians','Only birds','Only fish','Only insects'],0],['Which is an aquatic habitat?',['Desert','Forest','Ocean','Mountain'],2],['What can habitat damage cause?',['More biodiversity always','Loss of biodiversity','No change','Only faster movement'],1]];const qbox=document.getElementById('quiz');qbox.innerHTML=questions.map((q,i)=>'<div class="q"><strong>'+(i+1)+'. '+q[0]+'</strong>'+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+a+'</label>').join('')+'</div>').join('');const result=document.getElementById('result');const data=JSON.parse(localStorage.getItem(key)||'{"attempts":0,"best":0}');document.getElementById('submit').onclick=function(){let score=0;questions.forEach((q,i)=>{if(document.querySelector('input[name=q'+i+']:checked')?.value==q[2])score++});const pct=Math.round(score/questions.length*100);data.attempts++;data.best=Math.max(data.best,pct);localStorage.setItem(key,JSON.stringify(data));result.hidden=false;result.innerHTML='<strong>Score: '+score+'/'+questions.length+' ('+pct+'%)</strong><br>Attempts: '+data.attempts+' · Best score: '+data.best+'%<br><br>'+(pct>=80?'Excellent work!':pct>=60?'Good job. Review the missed concepts and retry.':'Revise the chapter carefully, especially the keyword and comparison sections, then try again.');result.scrollIntoView({behavior:'smooth'});};})();</script></body></html>
