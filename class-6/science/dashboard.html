<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | A2Z Learning Solutions</title><link rel="stylesheet" href="../../style.css"></head><body><main class="wrap"><header><h1>ðŸŽ“ Student Dashboard</h1><p id="welcome">Your Class 6 Science learning progress</p></header><section class="grid"><article class="card"><h2>Overall Progress</h2><div id="summary">Loadingâ€¦</div></article><article class="card"><h2>Performance Analytics</h2><div id="analytics">Loadingâ€¦</div></article><article class="card"><h2>Premium Learning</h2><p id="premium">Checking accessâ€¦</p><a class="btn" href="../../subscription.html">View Pro Plans â†’</a></article></section><h2>Chapter Progress</h2><section id="chapters" class="grid"></section></main><script>
