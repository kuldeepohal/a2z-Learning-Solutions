<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | A2Z Learning Solutions</title><link rel="stylesheet" href="../../style.css"><script src="chapter-data.js"></script></head><body><main class="wrap"><header><h1>🎓 Student Dashboard</h1><p>Your Class 6 Science learning progress</p></header><section class="grid"><article class="card"><h2>Overall Progress</h2><div id="summary"></div></article><article class="card"><h2>Performance Analytics</h2><div id="analytics"></div></article><article class="card"><h2>Premium Learning</h2><p>Unlock richer practice, AI tutoring, advanced assessments and premium study resources.</p><a class="btn" href="../../subscription.html">View Pro Plans →</a></article></section><h2>Chapter Progress</h2><section id="chapters" class="grid"></section></main><script>const p=JSON.parse(localStorage.getItem('a2z-progress-v1')||'{}');const rows=A2Z_CHAPTERS.map(c=>({c,p:p[c.id]||{quiz:0,attempts:0,completed:false}}));const done=rows.filter(x=>x.p.completed).length;const avg=Math.round(rows.reduce((a,x)=>a+(x.p.quiz||0),0)/rows.length);document.getElementById('summary').innerHTML=`<h3>${done}/${rows.length} chapters completed</h3><p>Average best score: <strong>${avg}%</strong></p><p>Learning coverage: <strong>${Math.round(done/rows.length*100)}%</strong></p>`;const attempted=rows.filter(x=>x.p.attempts>0);const strong=attempted.filter(x=>x.p.quiz>=80).length;document.getElementById('analytics').innerHTML=`<p>Chapters attempted: <strong>${attempted.length}</strong></p><p>Strong chapters (80%+): <strong>${strong}</strong></p><p>Needs revision: <strong>${attempted.filter(x=>x.p.quiz<60).length}</strong></p>`;document.getElementById('chapters').innerHTML=rows.map(x=>`<article class="card"><span>Chapter ${x.c.id}</span><h3>${x.c.title}</h3><p>Best score: <strong>${x.p.quiz||0}%</strong> · Attempts: ${x.p.attempts||0}</p><a class="btn" href="chapter-${x.c.id}/">${x.p.completed?'Review':'Study'} →</a></article>`).join('')</script></body></html>
