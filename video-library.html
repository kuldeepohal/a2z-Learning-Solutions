<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Lectures Library | A2Z Learning Solutions</title>
<link rel="stylesheet" href="style.css">
<!-- Google AdSense Placeholder -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
.video-hero { background: linear-gradient(135deg, #0f172a, var(--navy)); color: #fff; padding: 60px 0; border-radius: var(--radius); margin-top: 20px; text-align: center; }
.video-hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; }
.video-hero p { color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 30px; }
.video-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
.video-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.video-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #334155; display: flex; align-items: center; justify-content: center; }
.play-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.2s; }
.play-btn::after { content: "▶"; color: #fff; font-size: 1.5rem; margin-left: 4px; }
.video-card:hover .play-btn { background: var(--teal); }
.video-duration { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-family: var(--font-mono); font-weight: 700; }
.video-info { padding: 16px; }
.video-title { font-size: 1.05rem; color: var(--navy); font-weight: 700; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.video-meta { font-size: 0.85rem; color: var(--ink-soft); display: flex; justify-content: space-between; }
.filter-bar { display: flex; gap: 15px; margin-top: 40px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-select { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; font-size: 0.95rem; outline: none; background: #fff; min-width: 150px; }
</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5250183700649220" crossorigin="anonymous"></script>
</head>
<body>
<header class="topbar">
  <div class="container nav-wrap">
    <a class="logo" href="index.html">A2Z <span class="accent">Learning</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="classes.html">Classes</a>
      <a href="blog.html">Blog</a>
      <a href="forum.html">Forum</a>
      <a href="video-library.html" style="color:var(--teal)">Videos</a>
      <a href="auth.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem;">Login</a>
    </nav>
  </div>
</header>
<main class="container">
  <div class="video-hero">
    <h1>Video Lectures Library</h1>
    <p>Watch detailed concept explanations, experiment demonstrations, and problem-solving masterclasses.</p>
  </div>

  <div class="filter-bar">
    <select class="filter-select">
      <option value="">All Classes</option>
      <option value="10">Class 10</option>
      <option value="11">Class 11</option>
      <option value="12">Class 12</option>
    </select>
    <select class="filter-select">
      <option value="">All Subjects</option>
      <option value="physics">Physics</option>
      <option value="chemistry">Chemistry</option>
      <option value="maths">Mathematics</option>
      <option value="biology">Biology</option>
    </select>
  </div>

  <h2>Recently Added</h2>
  <!-- Google AdSense Ad Unit -->
  <div style="margin-bottom: 20px; text-align: center;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>
  <div class="video-grid" id="videoGrid">
    <p>Loading videos...</p>
  </div>
</main>

<!-- Video Modal -->
<div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="position:relative; width:90%; max-width:800px; background:#000; border-radius:12px; overflow:hidden;">
    <button onclick="closeVideo()" style="position:absolute; top:10px; right:10px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:1.5rem; width:40px; height:40px; border-radius:50%; cursor:pointer; z-index:10;">&times;</button>
    <div style="position:relative; padding-bottom:56.25%; height:0;">
      <iframe id="videoIframe" src="" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>
</div>

<footer class="footer" style="margin-top: 80px;">
  <div class="container">
    <p>A2Z Learning Solutions · Video Library</p>
  </div>
</footer>
<script>
  function openVideo(url) {
    document.getElementById('videoIframe').src = url;
    document.getElementById('videoModal').style.display = 'flex';
  }
  function closeVideo() {
    document.getElementById('videoIframe').src = '';
    document.getElementById('videoModal').style.display = 'none';
  }

  async function loadVideos() {
    try {
      const res = await fetch('/api/content/videos');
      const videos = await res.json();
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      if (!videos.length) {
        grid.innerHTML = '<p>No videos available yet.</p>';
        return;
      }
      videos.forEach(video => {
        const thumbUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;
        grid.innerHTML += `
          <div class="video-card" onclick="openVideo('${video.url}')">
            <div class="video-thumb" style="background-image: url('${thumbUrl}'); background-size: cover; background-position: center;">
              <div class="play-btn"></div>
              <div class="video-duration">${video.duration || '10:00'}</div>
            </div>
            <div class="video-info">
              <h3 class="video-title">${video.title}</h3>
              <div class="video-meta"><span>Class ${video.grade || 'General'} · ${video.tags[0] || 'General'}</span><span>New</span></div>
            </div>
          </div>
        `;
      });
    } catch (e) {
      console.error(e);
      document.getElementById('videoGrid').innerHTML = '<p>Failed to load videos.</p>';
    }
  }
  loadVideos();
</script>
</body>
</html>
