<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Recent Updates | A2Z Learning Solutions</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container" style="max-width:1100px;padding:32px 20px"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap"><div><p class="eyebrow">A2Z ADMIN</p><h1>Recent Updates</h1><p>Publish academic and competitive-exam updates to the public feed.</p></div><button id="logout">Log out</button></div>
<section class="feature-card" style="margin:24px 0"><h2 id="formTitle">Publish update</h2><form id="updateForm"><input type="hidden" id="id"><label>Title<input id="title" required maxlength="180"></label><label>Category<select id="category" required><option>Academic</option><option>Competitive Exams</option><option>NEET</option><option>JEE</option><option>Olympiad</option><option>Homi Bhabha</option><option>Scholarship</option><option>Results</option><option>Deadline</option><option>Board</option></select></label><label>Summary<textarea id="summary" required maxlength="500"></textarea></label><label>Official source name<input id="sourceName" maxlength="120"></label><label>Official source URL<input id="sourceUrl" type="url"></label><div style="display:flex;gap:12px;align-items:center"><label><input id="published" type="checkbox" checked> Published</label><button type="submit">Save update</button><button type="button" id="cancel" hidden>Cancel edit</button></div><p id="message"></p></form></section>
<section><h2>Published & scheduled updates</h2><div id="list">Loading…</div></section></main><script>
const API=window.A2Z_API_BASE||localStorage.getItem('A2Z_API_BASE')||'';const token=localStorage.getItem('a2z_token')||localStorage.getItem('a2zToken');if(!token)location.href='login.html';
const $=id=>document.getElementById(id);const headers=()=>({'Content-Type':'application/json',Authorization:`Bearer ${token}`});
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{...headers(),...(options.headers||{})}});if(r.status===401||r.status===403){localStorage.removeItem('a2z_token');localStorage.removeItem('a2zToken');location.href='login.html';throw Error('Unauthorized')}if(!r.ok)throw Error((await r.json()).error||'Request failed');return r.json()}
async function load(){try{const data=await api('/api/admin/updates');$('list').innerHTML=data.map(u=>`<article class="feature-card" style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>${esc(u.title)}</strong><p>${esc(u.category)} · ${new Date(u.published_at||u.created_at).toLocaleDateString('en-IN')} · ${u.published?'Published':'Draft'}</p><p>${esc(u.summary)}</p></div><div><button onclick='edit(${JSON.stringify(u).replaceAll("'","&#39;")})'>Edit</button> <button onclick="removeUpdate(${u.id})">Delete</button></div></div></article>`).join('')||'<p>No updates yet.</p>'}catch(e){$('list').textContent=e.message}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.edit=u=>{['id','title','category','summary','sourceName','sourceUrl'].forEach(k=>$(k).value=u[k]??'');$('published').checked=!!u.published;$('formTitle').textContent='Edit update';$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})};
window.removeUpdate=async id=>{if(!confirm('Delete this update?'))return;await api('/api/admin/updates/'+id,{method:'DELETE'});load()};
$('updateForm').onsubmit=async e=>{e.preventDefault();const id=$('id').value;const body={title:$('title').value,category:$('category').value,summary:$('summary').value,sourceName:$('sourceName').value,sourceUrl:$('sourceUrl').value,published:$('published').checked};try{await api(id?'/api/admin/updates/'+id:'/api/admin/updates',{method:id?'PATCH':'POST',body:JSON.stringify(body)});$('message').textContent='Saved successfully.';reset();load()}catch(e){$('message').textContent=e.message}};
function reset(){$('updateForm').reset();$('id').value='';$('published').checked=true;$('formTitle').textContent='Publish update';$('cancel').hidden=true}$('cancel').onclick=reset;$('logout').onclick=()=>{localStorage.removeItem('a2z_token');localStorage.removeItem('a2zToken');location.href='login.html'};load();
</script></body></html>
