<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | A2Z Learning Solutions</title><link rel="stylesheet" href="style.css">    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5250183700649220" crossorigin="anonymous"></script>
</head><body><main class="wrap"><section class="card" style="max-width:520px;margin:50px auto"><h1>Student Account</h1><p>Sign in to save progress across devices, track assessments and unlock premium access.</p><input id="name" placeholder="Full name" style="width:100%;padding:12px;margin:6px 0"><input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:6px 0"><input id="password" type="password" placeholder="Password (8+ characters)" style="width:100%;padding:12px;margin:6px 0"><select id="grade" style="width:100%;padding:12px;margin:6px 0"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option></select><div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-primary" onclick="submitAuth('login')">Login</button><button class="btn btn-secondary" onclick="submitAuth('register')">Create account</button></div><p id="message"></p></section></main><script src="config.js"></script><script>
const API_BASE=window.A2Z_API_BASE||window.location.origin;
async function submitAuth(mode){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('name').value.trim(),grade=Number(document.getElementById('grade').value),m=document.getElementById('message');try{const r=await fetch(API_BASE+'/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,grade})});const d=await r.json();if(!r.ok)throw Error(d.error||'Authentication failed');localStorage.setItem('a2z_auth_token',d.token);location.href=new URLSearchParams(location.search).get('next')||'class-6/science/dashboard.html';}catch(e){m.textContent=e.message;m.style.color='crimson';}}
</script></body></html>
